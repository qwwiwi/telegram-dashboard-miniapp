<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Панель бизнеса</title>
<style>
:root { color-scheme:light; --bg:#f6f7f9; --surface:#fff; --text:#202832; --muted:#5e6876; --border:#dce1e7; --accent:#345bd5; --soft:#edf1ff; --good:#187044; --bad:#b33535; --neutral:#8793a6; }
@media(prefers-color-scheme:dark) { :root { color-scheme:dark; --bg:#13171e; --surface:#1b212b; --text:#edf0f6; --muted:#aeb8c7; --border:#384252; --accent:#9bb4ff; --soft:#283653; --good:#83d5a5; --bad:#ffa0a0; --neutral:#7d899d; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-variant-numeric:tabular-nums; }
main { max-width:1200px; margin:auto; padding:32px 20px; }
h1 { font-size:30px; letter-spacing:-1px; margin:6px 0; font-weight:650; }
h2 { font-size:19px; margin:0; font-weight:600; } h3 { font-size:15px; margin:0; font-weight:600; }
p { margin:6px 0; } .muted,small { color:var(--muted); } small { font-size:12px; }
header { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:20px; margin-bottom:26px; }
.eyebrow { font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
button,summary { font:inherit; cursor:pointer; } button { color:var(--text); border:1px solid var(--border); background:var(--surface); min-height:44px; border-radius:8px; padding:9px 14px; }
button:focus-visible,summary:focus-visible,[tabindex]:focus-visible { outline:3px solid var(--accent); outline-offset:3px; }
.periods { display:flex; padding:4px; border:1px solid var(--border); border-radius:10px; gap:3px; background:var(--surface); }
.periods button { border:0; background:transparent; }
.periods button[aria-pressed="true"] { background:var(--soft); color:var(--accent); font-weight:600; }
.tabs { display:grid; grid-template-columns:repeat(4,minmax(max-content,1fr)); overflow-x:auto; border-bottom:1px solid var(--border); margin-bottom:26px; gap:8px; }
.tabs button { white-space:nowrap; border:0; border-bottom:2px solid transparent; border-radius:0; background:transparent; padding:12px 4px; color:var(--muted); }
.tabs button[aria-selected="true"] { color:var(--accent); border-bottom-color:var(--accent); font-weight:600; }
.section-head { margin:0 0 20px; } .cards { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; margin-bottom:20px; }
.cards:has(> :nth-child(4):last-child) { grid-template-columns:repeat(2,minmax(0,1fr)); }
.card,.panel { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:22px; min-width:0; }
.card-label { color:var(--muted); font-size:13px; margin:0 0 12px; font-weight:400; }
.value { font-size:28px; font-weight:600; letter-spacing:-.7px; overflow-wrap:anywhere; line-height:1.25; }
.unit { font-size:15px; font-weight:400; color:var(--muted); letter-spacing:0; }
.change { font-size:12px; margin-top:12px; } .good { color:var(--good); } .bad { color:var(--bad); }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; } .panel { margin-bottom:20px; }
.chart { width:100%; height:240px; display:block; margin:20px 0 6px; overflow:visible; }
.chart text { fill:var(--muted); font-size:12px; font-family:inherit; }
.chart .axis { stroke:var(--border); } .chart .line { stroke:var(--accent); fill:none; stroke-width:2.5; }
.chart .point { fill:var(--accent); } .chart [data-tip] { cursor:pointer; }
.tooltip { min-height:24px; color:var(--text); font-size:12px; margin-bottom:10px; }
summary { color:var(--accent); padding:10px 0; min-height:44px; }
table { width:100%; border-collapse:collapse; font-size:13px; table-layout:fixed; margin-top:10px; }
caption { text-align:left; color:var(--muted); margin-bottom:8px; }
th,td { padding:11px 6px; border-bottom:1px solid var(--border); text-align:right; overflow-wrap:anywhere; }
th { color:var(--muted); font-weight:500; } th:first-child,td:first-child { text-align:left; }
.legend { display:flex; flex-wrap:wrap; gap:10px 18px; font-size:12px; color:var(--muted); }
.swatch { display:inline-block; width:10px; height:10px; margin-right:6px; border-radius:2px; background:var(--accent); }
footer { color:var(--muted); border-top:1px solid var(--border); padding-top:20px; margin-top:12px; font-size:12px; }
.notice { font-size:12px; color:var(--muted); margin:8px 0 18px; }
[hidden] { display:none !important; }
@media(max-width:650px) {
 main { padding:24px 16px; } h1 { font-size:27px; } header { gap:16px; margin-bottom:18px; }
 .periods { width:100%; } .periods button { flex:1; } .tabs { gap:0; margin-bottom:22px; }
 .tabs button { font-size:12px; padding:12px 10px; } .cards { grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
 .card,.panel { padding:16px; } .value { font-size:23px; } .unit { font-size:12px; }
 .grid { grid-template-columns:1fr; gap:0; } .change { font-size:11px; } th,td { padding:10px 3px; font-size:12px; }
}
@media(prefers-reduced-motion:no-preference) { button { transition:background .15s,color .15s; } }
</style>
</head>
<body>
<main>
<header><div><div class="eyebrow" id="company"></div><h1>Панель бизнеса</h1><p class="muted">Главные цифры. Понятные решения.</p></div>
<div class="periods" role="group" aria-label="Период"><button data-days="7" aria-pressed="false">7 дней</button><button data-days="30" aria-pressed="true">30 дней</button><button data-days="90" aria-pressed="false">90 дней</button></div></header>
<nav class="tabs" role="tablist" aria-label="Разделы бизнеса" id="tabs"></nav>
<div class="section-head"><h2 id="section-title"></h2><p id="range" class="muted"></p></div>
<p class="notice" id="coverage" role="status"></p>
<section id="content" role="tabpanel" tabindex="0"></section>
<footer id="footer"></footer>
<noscript>Включите JavaScript в браузере, чтобы увидеть показатели.</noscript>
</main>
<script>
// ЗАМЕНИТЕ ЭТИ ДАННЫЕ
const DATA = {
  company: 'Демо-компания', updatedAt: '2026-11-10T18:00:00+03:00', endDate: '2026-11-10',
  departments: [
    {id:'overview', label:'Сводка', metrics:['revenue','leads','deals','conversion','adSpend','profit']},
    {id:'marketing', label:'Маркетинг', metrics:['traffic','leads','adSpend','cpl']},
    {id:'sales', label:'Продажи (CRM)', metrics:['deals','average','conversion','cycle']},
    {id:'finance', label:'Финансы', metrics:['revenue','expenses','profit','cash']}
  ],
  metrics: {
    revenue:{label:'Выручка',unit:'₽'}, leads:{label:'Заявки',unit:'шт.'},
    deals:{label:'Сделки',unit:'шт.'}, conversion:{label:'Конверсия в сделку',unit:'%',digits:1},
    adSpend:{label:'Расходы на рекламу',unit:'₽',lower:true}, profit:{label:'Прибыль',unit:'₽'},
    traffic:{label:'Трафик',unit:'визитов'}, cpl:{label:'Стоимость заявки CPL',unit:'₽',lower:true},
    average:{label:'Средний чек',unit:'₽'}, cycle:{label:'Цикл сделки',unit:'дн.',digits:1,lower:true},
    expenses:{label:'Расходы',unit:'₽',lower:true}, cash:{label:'Остаток денег',unit:'₽'}
  },
  channels:['Поиск','Соцсети','Рекомендации','Прямые обращения'],
  expenseCategories:['Реклама','Команда','Сервисы','Прочее'],
  stages:[{label:'Заявка',key:'leads'},{label:'Квалификация',key:'qualified'},{label:'Предложение',key:'proposals'},{label:'Оплата',key:'deals'}],
  latestDeals:[
    {date:'2026-11-10',name:'Клиент А',amount:30000,status:'Оплачено'},
    {date:'2026-11-09',name:'Клиент Б',amount:20000,status:'Оплачено'},
    {date:'2026-11-08',name:'Клиент В',amount:40000,status:'Оплачено'},
    {date:'2026-11-07',name:'Клиент Г',amount:30000,status:'Оплачено'},
    {date:'2026-11-06',name:'Клиент Д',amount:20000,status:'Оплачено'}
  ],
  // Each row is one day. Missing dates or null values mean unknown, never zero.
  // channels and costs follow the category order above; cycleDays is the sum for paid deals.
  daily: (() => {
    let seed=20261110, cash=365000;
    const random=()=>((seed=(Math.imul(seed,1664525)+1013904223)>>>0)/4294967296);
    return Array.from({length:180},(_,i)=>{
      const d=new Date(Date.UTC(2026,4,15+i)), date=d.toISOString().slice(0,10);
      const weekend=[0,6].includes(d.getUTCDay())?.67:1;
      const traffic=Math.round((950+i*1.8)*weekend*(.8+random()*.4));
      const leads=Math.round(traffic*(.037+random()*.022));
      const qualified=Math.round(leads*(.65+random()*.15)), proposals=Math.round(qualified*(.6+random()*.18));
      const deals=Math.max(1,Math.round(proposals*(.18+random()*.15)));
      const revenue=deals*Math.round((16000+random()*12000)/100)*100;
      const adSpend=Math.round((5000+random()*3000)*weekend);
      const costs=[adSpend,24000,Math.round(2000+random()*1800),Math.round(1000+random()*2500)];
      const expenses=costs.reduce((a,b)=>a+b,0); cash+=revenue-expenses;
      const channels=[Math.round(leads*(.38+random()*.12)),Math.round(leads*.22),Math.round(leads*.18)];
      channels.push(leads-channels.reduce((a,b)=>a+b,0));
      const row={date,traffic,leads,qualified,proposals,deals,revenue,adSpend,expenses,cash,cycleDays:deals*(7+Math.floor(random()*6)),channels,costs};
      // Missing source snapshots remain unknown; cash resumes with the next snapshot.
      if([112,158,175].includes(i)) Object.keys(row).forEach(k=>{if(k!=='date') row[k]=null;});
      return row;
    });
  })()
};
// Optional API replacement: return the same complete DATA schema (180 days).
// async function loadSummary() {
//   const response = await fetch('/api/summary?days=30');
//   if (!response.ok) throw new Error('Не удалось загрузить данные');
//   const data = await response.json();
//   return data;
// }
// Replace const DATA = {...} with await loadSummary() inside an async bootstrap.

const $ = id => document.getElementById(id);
const esc = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const numeric = v => typeof v === 'number' && Number.isFinite(v);
const fmt = (v, digits=0) => numeric(v) ? v.toLocaleString('ru-RU',{maximumFractionDigits:digits}).replace(/[\u00a0\u202f]/g,' ') : '–';
const date = s => new Date(s+'T00:00:00Z');
const day = d => d.toISOString().slice(0,10);
const shift = (s,n) => day(new Date(date(s).getTime()+n*86400000));
const shortDate = s => date(s).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',timeZone:'UTC'});
let days=30, active=DATA.departments[0].id;
const daily = new Map(DATA.daily.map(row => [row.date,row]));
function period(offset=0) {
  return Array.from({length:days},(_,i) => {
    const key=shift(DATA.endDate,-offset-days+1+i);
    return daily.get(key) || {date:key};
  });
}
// Totals add up the known days; a day without data stays a gap on the chart, never a zero.
function sum(rows,key) {
  const values=rows.map(row => row[key]).filter(numeric);
  return values.length ? values.reduce((a,b)=>a+b,0) : null;
}
const ratio = (a,b,m=1) => numeric(a) && numeric(b) && b!==0 ? a/b*m : null;
function metrics(rows) {
  const values={};
  ['revenue','leads','deals','adSpend','traffic','expenses','cycleDays'].forEach(k=>values[k]=sum(rows,k));
  values.profit=numeric(values.revenue)&&numeric(values.expenses)?values.revenue-values.expenses:null;
  values.conversion=ratio(values.deals,values.leads,100);
  values.cpl=ratio(values.adSpend,values.leads);
  values.average=ratio(values.revenue,values.deals);
  values.cycle=ratio(values.cycleDays,values.deals);
  // Cash is a snapshot: take the latest known day of the period.
  values.cash=rows.findLast(r=>numeric(r.cash))?.cash ?? null;
  // Known days per additive metric, so periods with different gaps compare fairly.
  values.known={};
  ['revenue','leads','deals','adSpend','traffic','expenses'].forEach(k=>values.known[k]=rows.filter(r=>numeric(r[k])).length);
  values.known.profit=rows.filter(r=>numeric(r.revenue)&&numeric(r.expenses)).length;
  return values;
}
function cards(rows,previous) {
  const current=metrics(rows), before=metrics(previous);
  return '<div class="cards">'+DATA.departments.find(d=>d.id===active).metrics.map(key=>{
    const m=DATA.metrics[key], a=current[key], b=before[key];
    // Totals over unequal known days compare as per-day averages.
    const na=current.known[key], nb=before.known[key], perDay=na!==undefined&&na!==nb;
    const ca=perDay?ratio(a,na):a, cb=perDay?ratio(b,nb):b;
    const diff=numeric(ca)&&numeric(cb)&&cb!==0?Math.round((ca-cb)/Math.abs(cb)*1000)/10:null;
    const tone=diff===null||diff===0?'muted':(m.lower?diff<0:diff>0)?'good':'bad';
    const label=key==='revenue'&&active==='finance'?'Доходы':m.label;
    const change=diff===null?'Нет данных для сравнения':diff===0?'0 % · без изменений':`${diff>0?'+':'−'}${fmt(Math.abs(diff),1)} % к прошлому периоду${perDay?' (в среднем за день)':''}`;
    return `<article class="card"><h3 class="card-label">${esc(label)}</h3><div class="value">${fmt(a,m.digits)} <span class="unit">${esc(m.unit)}</span></div><div class="change ${tone}">${change}</div></article>`;
  }).join('')+'</div>';
}
function table(headers,rows,caption='Значения за выбранный период') {
  return `<table><caption>${esc(caption)}</caption><thead><tr>${headers.map(h=>`<th scope="col">${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>'<tr>'+r.map((v,i)=>i===0?`<th scope="row">${esc(v)}</th>`:`<td>${esc(v)}</td>`).join('')+'</tr>').join('')}</tbody></table>`;
}
function panel(title,svg,headers,rows,note='Нажмите на график, чтобы увидеть значение.') {
  return `<article class="panel"><h3>${esc(title)}</h3><svg class="chart" viewBox="0 0 600 240" role="group" aria-label="${esc(title)}">${svg}</svg><p class="tooltip" aria-live="polite">${esc(note)}</p><details><summary>Показать таблицей</summary>${table(headers,rows,title)}</details></article>`;
}
const tip = s => `tabindex="0" role="button" aria-label="${esc(s)}" data-tip="${esc(s)}"`;
function line(rows,key,title,unit) {
  const peak=Math.max(1,...rows.map(r=>numeric(r[key])?r[key]:0));
  const magnitude=10**Math.floor(Math.log10(peak/3));
  const step=Math.max(1,[1,2,5,10].find(n=>n*magnitude>=peak/3)*magnitude);
  const max=Math.ceil(peak/step)*step;
  const scale=peak>=1000000?1000000:peak>=1000?1000:1;
  const suffix=scale===1000000?' млн':scale===1000?' тыс.':'';
  const digits=scale===1?0:Math.max(0,Math.ceil(-Math.log10(step/scale)));
  const x=i=>48+i*536/Math.max(1,rows.length-1), y=v=>192-v/max*152;
  let svg='',path='',newSegment=true;
  Array.from({length:Math.round(max/step)+1},(_,i)=>i*step).forEach(value=>{const yy=y(value);svg+=`<line class="axis" x1="48" x2="584" y1="${yy}" y2="${yy}"/><text x="2" y="${yy-6}">${fmt(value/scale,digits)}${suffix}</text>`;});
  rows.forEach((r,i)=>{
    if(!numeric(r[key])) {newSegment=true;return;}
    path+=`${newSegment?'M':'L'}${x(i)},${y(r[key])} `;newSegment=false;
  });
  svg+=`<path class="line" d="${path}"/>`;
  rows.forEach((r,i)=>{
    const text=`${shortDate(r.date)}: ${numeric(r[key])?fmt(r[key])+' '+unit:'нет данных'}`;
    svg+=`<g ${tip(text)}><rect x="${i===0?48:(x(i-1)+x(i))/2}" y="20" width="${536/Math.max(1,rows.length-1)*(i===0||i===rows.length-1?.5:1)}" height="180" fill="transparent"/>`;
    if(numeric(r[key])) svg+=`<circle class="point" cx="${x(i)}" cy="${y(r[key])}" r="${rows.length>30?2:3}"/>`;
    svg+='</g>';
  });
  svg+=`<text x="48" y="227">${shortDate(rows[0].date)}</text><text x="584" y="227" text-anchor="end">${shortDate(rows.at(-1).date)}</text>`;
  return panel(title,svg,['Дата',unit],rows.map(r=>[shortDate(r.date),numeric(r[key])?fmt(r[key]):'Нет данных']),'Пропуски – дни без данных. Нажмите на день для подробностей.').replace('<svg class="chart"','<svg class="chart" data-plot-left="48"');
}
function breakdown(rows,key,labels) {
  return labels.map((label,i)=>({label,value:sum(rows.map(r=>({v:r[key]?.[i]})),'v')}));
}
function bars(items,title,unit) {
  const max=Math.max(1,...items.map(i=>i.value||0));
  const h=180/Math.max(1,items.length);
  const svg=items.map((item,i)=>{
    const text=`${item.label}: ${numeric(item.value)?fmt(item.value)+' '+unit:'нет данных'}`;
    return `<g ${tip(text)}><rect x="0" y="${i*h}" width="600" height="${h}" fill="transparent"/><text x="0" y="${i*h+20}">${esc(item.label)}</text><rect x="0" y="${i*h+30}" width="${numeric(item.value)?item.value/max*600:0}" height="10" rx="3" fill="var(--accent)"/><text x="596" y="${i*h+20}" text-anchor="end">${fmt(item.value)}</text></g>`;
  }).join('');
  return panel(title,svg,['Источник',unit],items.map(i=>[i.label,numeric(i.value)?fmt(i.value):'Нет данных']));
}
function funnel(rows) {
  const items=DATA.stages.map(s=>({label:s.label,value:sum(rows,s.key)}));
  const max=Math.max(1,items[0].value||0);
  const svg=items.map((s,i)=>{
    const conversion=i?ratio(s.value,items[i-1].value,100):100;
    const label=`${s.label}: ${fmt(s.value)}; ${i?'от прошлого этапа':'вход'}: ${fmt(conversion,1)} %`;
    return `<g ${tip(label)}><rect x="0" y="${i*58}" width="600" height="54" fill="transparent"/><text x="0" y="${i*58+16}">${esc(s.label)}</text><text x="600" y="${i*58+16}" text-anchor="end">${fmt(s.value)} · ${fmt(conversion,1)} %</text><rect x="0" y="${i*58+28}" width="${numeric(s.value)?s.value/max*600:0}" height="12" rx="3" fill="var(--accent)"/></g>`;
  }).join('');
  return panel('Воронка продаж',svg,['Этап','Количество','От прошлого этапа'],items.map((s,i)=>[s.label,fmt(s.value),i?fmt(ratio(s.value,items[i-1].value,100),1)+' %':'–']),'Демо-воронка: этапы одной группы заявок, процент от предыдущего этапа.');
}
function weekly(rows) {
  const weeks=[];
  for(let i=0;i<rows.length;i+=7) {
    const slice=rows.slice(i,i+7);
    weeks.push({label:shortDate(slice[0].date),income:sum(slice,'revenue'),expense:sum(slice,'expenses')});
  }
  const max=Math.max(1,...weeks.flatMap(w=>[w.income||0,w.expense||0]));
  const width=540/weeks.length;
  let svg='<text x="8" y="16">₽</text><line class="axis" x1="40" x2="590" y1="195" y2="195"/>';
  weeks.forEach((w,i)=>{
    ['income','expense'].forEach((key,j)=>{
      const value=w[key], x=44+i*width+j*width*.35;
      const text=`Неделя с ${w.label}, ${j?'расходы':'доходы'}: ${numeric(value)?fmt(value)+' ₽':'нет данных'}`;
      svg+=`<g ${tip(text)}><rect x="${x}" y="25" width="${width*.32}" height="174" fill="transparent"/><rect x="${x}" y="${numeric(value)?195-value/max*150:195}" width="${width*.32}" height="${numeric(value)?value/max*150:0}" rx="2" fill="${j?'var(--neutral)':'var(--accent)'}"/></g>`;
    });
    if(weeks.length<=5||i%3===0) svg+=`<text x="${44+i*width}" y="225">${w.label}</text>`;
  });
  return panel('Доходы и расходы по неделям',svg,['Неделя с','Доходы, ₽','Расходы, ₽'],weeks.map(w=>[w.label,fmt(w.income),fmt(w.expense)]),'Доходы – акцентный цвет, расходы – серый. Недели по 7 дней от начала периода; последняя может быть неполной.');
}
function shares(rows) {
  const items=breakdown(rows,'costs',DATA.expenseCategories);
  const total=sum(items,'value'); let x=0;
  const fills=['var(--accent)','var(--neutral)','var(--muted)','var(--border)'];
  let svg='';
  items.forEach((item,i)=>{
    const percent=ratio(item.value,total,100), width=numeric(percent)?percent*6:0;
    svg+=`<g ${tip(item.label+': '+fmt(item.value)+' ₽ · '+fmt(percent,1)+' %')}><rect x="${x}" y="20" width="${width}" height="36" fill="${fills[i%fills.length]}"/></g>`;
    x+=width;
    svg+=`<rect x="0" y="${85+i*36}" width="10" height="10" fill="${fills[i%fills.length]}"/><text x="20" y="${95+i*36}">${esc(item.label)}</text><text x="600" y="${95+i*36}" text-anchor="end">${fmt(percent,1)} % · ${fmt(item.value)} ₽</text>`;
  });
  return panel('Структура расходов',svg,['Статья','Сумма, ₽','Доля'],items.map(i=>[i.label,fmt(i.value),fmt(ratio(i.value,total,100),1)+' %']),total===0?'Расходов за период нет.':numeric(total)?'Доли от всех расходов за выбранный период.':'Недостаточно данных для расчёта структуры.');
}
// Recalculate horizontal geometry in CSS pixels; never scale text or chart height.
const chartGeometry=new WeakMap();
function fitChart(chart) {
  if(!chartGeometry.has(chart)) chartGeometry.set(chart,[...chart.querySelectorAll('*')].map(el=>({
    el, attrs:['x','x1','x2','cx','width'].filter(a=>el.hasAttribute(a)).map(a=>[a,Number(el.getAttribute(a))])
  })));
  const width=chart.getBoundingClientRect().width;
  if(!width) return;
  const scale=width/600;
  // Line charts keep the plot right of the axis labels: labels stay put, the plot starts after the widest one.
  const left=Number(chart.dataset.plotLeft)||0;
  const labelWidth=left?Math.max(0,...chartGeometry.get(chart).filter(({el,attrs})=>el.tagName.toLowerCase()==='text'&&attrs.some(([a,v])=>a==='x'&&v<left)).map(({el,attrs})=>attrs.find(([a])=>a==='x')[1]+el.getComputedTextLength())):0;
  const start=left?Math.max(left*scale,labelWidth+8):0, plotScale=left?(width-start)/(600-left):scale;
  const mapX=v=>left?(v<left?v:start+(v-left)*plotScale):v*scale;
  chart.setAttribute('viewBox',`0 0 ${width} 240`);
  chartGeometry.get(chart).forEach(({el,attrs})=>{
    attrs.forEach(([a,v])=>el.setAttribute(a,a==='width'?v*plotScale:mapX(v)));
    if(el.tagName.toLowerCase()==='path') {
      el.setAttribute('transform',`translate(${left?start-left*plotScale:0} 0) scale(${plotScale} 1)`);
      el.setAttribute('vector-effect','non-scaling-stroke');
    }
  });
}
const chartObserver=new ResizeObserver(entries=>entries.forEach(({target})=>fitChart(target)));
function render() {
  const rows=period(), previous=period(days), dept=DATA.departments.find(d=>d.id===active);
  $('section-title').textContent=dept.label;
  $('range').textContent=`${shortDate(rows[0].date)} – ${shortDate(rows.at(-1).date)} · ${days} дней`;
  const missing=rows.filter(r=>!numeric(r.revenue)).length;
  $('coverage').textContent=missing?`Данные неполные: ${missing} дн. без данных. Итоги посчитаны по дням с данными, графики сохраняют разрывы.`:'Сравнение с предыдущим периодом такой же длины.';
  $('content').setAttribute('aria-labelledby','tab-'+active);
  let html=cards(rows,previous);
  if(active==='overview') html+=line(rows,'revenue','Выручка по дням','₽');
  if(active==='marketing') html+='<div class="grid">'+bars(breakdown(rows,'channels',DATA.channels),'Заявки по каналам','шт.')+line(rows,'leads','Заявки по дням','шт.')+'</div>';
  if(active==='sales') {
    const deals=DATA.latestDeals.filter(d=>d.date>=rows[0].date&&d.date<=rows.at(-1).date).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
    html+='<div class="grid">'+funnel(rows)+'<article class="panel"><h3>Последние сделки</h3>'+table(['Клиент / дата','Сумма, ₽','Статус'],deals.map(d=>[d.name+' · '+shortDate(d.date),fmt(d.amount),d.status]),'До 5 последних сделок за период')+(deals.length?'':'<p>За период сделок нет.</p>')+'</article></div>';
  }
  if(active==='finance') html+='<div class="grid">'+weekly(rows)+shares(rows)+'</div>';
  chartObserver.disconnect();
  $('content').innerHTML=html;
  document.querySelectorAll('.chart').forEach(chart=>{fitChart(chart);chartObserver.observe(chart);});
  document.querySelectorAll('[data-days]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.days)===days)));
  document.querySelectorAll('[role="tab"]').forEach(b=>{const selected=b.dataset.tab===active;b.setAttribute('aria-selected',String(selected));b.tabIndex=selected?0:-1;});
}
// Derive semantic colors from the effective background, including Telegram themes.
function applyTheme() {
  const p=window.Telegram?.WebApp?.themeParams;
  if(!p || !Object.keys(p).length) return;
  const root=document.documentElement;
  const valid=c=>typeof c==='string'&&/^#[0-9a-f]{6}$/i.test(c);
  const luminance=c=>{
    const rgb=c.slice(1).match(/../g).map(h=>parseInt(h,16)/255).map(v=>v<=.04045?v/12.92:((v+.055)/1.055)**2.4);
    return rgb[0]*.2126+rgb[1]*.7152+rgb[2]*.0722;
  };
  const bg=valid(p.bg_color)?p.bg_color:'#ffffff', dark=luminance(bg)<.3;
  const contrast=(a,b)=>(Math.max(luminance(a),luminance(b))+.05)/(Math.min(luminance(a),luminance(b))+.05);
  const surface=valid(p.secondary_bg_color)?p.secondary_bg_color:bg;
  const readable=(candidate,fallback)=>valid(candidate)&&contrast(candidate,bg)>=4.5&&contrast(candidate,surface)>=4.5?candidate:fallback;
  const text=contrast('#ffffff',bg)>contrast('#202832',bg)?'#ffffff':'#202832';
  const vars={bg,surface,text:readable(p.text_color,text),muted:readable(p.hint_color,text),accent:readable(p.button_color,text),soft:surface,border:dark?'#647084':'#9ba5b4',good:dark?'#83d5a5':'#187044',bad:dark?'#ffa0a0':'#b33535',neutral:dark?'#7d899d':'#8793a6'};
  Object.entries(vars).forEach(([key,value])=>root.style.setProperty('--'+key,value));
  root.style.colorScheme=dark?'dark':'light';
}
$('company').textContent=DATA.company;
$('footer').textContent='Данные демо. Обновлено: '+new Date(DATA.updatedAt).toLocaleString('ru-RU',{timeZone:'Europe/Moscow',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})+' (МСК)';
$('tabs').innerHTML=DATA.departments.map(d=>`<button role="tab" id="tab-${esc(d.id)}" data-tab="${esc(d.id)}" aria-controls="content" aria-selected="false">${esc(d.label)}</button>`).join('');
document.addEventListener('click',e=>{
  const periodButton=e.target.closest('[data-days]'), tab=e.target.closest('[data-tab]');
  if(periodButton) {days=Number(periodButton.dataset.days);render();}
  if(tab) {active=tab.dataset.tab;render();}
  showTip(e);
});
function showTip(e) {
  const target=e.target.closest('[data-tip]');
  if(target) target.closest('.panel').querySelector('.tooltip').textContent=target.dataset.tip;
}
document.addEventListener('focusin',showTip);
document.addEventListener('keydown',e=>{
  if(e.target.matches('[data-tip]')&&['Enter',' '].includes(e.key)) {e.preventDefault();showTip(e);}
  if(e.target.matches('[role="tab"]')&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)) {
    e.preventDefault(); const tabs=[...$('tabs').children], i=tabs.indexOf(e.target);
    const next=e.key==='Home'?0:e.key==='End'?tabs.length-1:(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;
    active=tabs[next].dataset.tab;render();tabs[next].focus();
  }
});
applyTheme();
window.Telegram?.WebApp?.onEvent?.('themeChanged',applyTheme);
render();
</script>
